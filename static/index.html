<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Mobile Viewport Fix (Zaroori) -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Travel Agent</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Ultra-Minimalist Black & Grey Theme */
        :root {
            --bg-color: #0a0a0a;
            --surface-color: #171717;
            --text-main: #f5f5f5;
            --text-muted: #a3a3a3;
            --accent: #262626;
            --user-bubble: #262626;
            --bot-bubble: #171717;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            /* Mobile Safari Fix */
            min-height: 100dvh; 
            display: flex;
            flex-direction: column;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .header button {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
        }

        /* --- HERO SECTION (Welcome Screen) --- */
        .hero-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .hero-section h2 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 400;
        }

        .hero-section p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-width: 600px;
        }

        .suggestion-card {
            background-color: var(--surface-color);
            border: 1px solid var(--accent);
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s ease;
            font-size: 14px;
        }

        .suggestion-card:hover {
            background-color: var(--accent);
            color: var(--text-main);
        }

        /* --- CHAT AREA --- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .hidden {
            display: none !important;
        }

        .message {
            max-width: 85%;
            padding: 15px;
            border-radius: 10px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--user-bubble);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: var(--bot-bubble);
            align-self: flex-start;
            border: 1px solid var(--accent);
            border-bottom-left-radius: 2px;
        }

        /* Markdown lists formatting inside bot message */
        .bot-message ul, .bot-message ol { margin-left: 20px; margin-top: 10px; }
        .bot-message h3 { margin-top: 10px; margin-bottom: 5px; font-size: 16px; }

        /* --- INPUT AREA --- */
        .input-container {
            padding: 15px 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--accent);
            position: sticky;
            bottom: 0;
            width: 100%;
        }

        .input-box {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background-color: var(--surface-color);
            padding: 5px 15px;
            border-radius: 30px;
            border: 1px solid var(--accent);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 16px;
            padding: 10px 0;
            outline: none;
        }

        .input-box button {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 18px;
            cursor: pointer;
            padding: 0 10px;
        }

        .input-box button:disabled {
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* --- MOBILE RESPONSIVE CSS --- */
        @media (max-width: 768px) {
            .hero-section h2 { font-size: 24px; }
            .message { max-width: 95%; font-size: 14px; }
            .input-container { padding: 10px; }
            .header h1 { font-size: 16px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1><i class="fa-solid fa-plane-departure" style="margin-right: 8px;"></i> AI Travel Agent</h1>
        <button id="btn-new-chat" title="New Chat"><i class="fa-regular fa-pen-to-square"></i></button>
    </div>

    <!-- Main Content -->
    <div id="hero-section" class="hero-section">
        <h2>Where to next?</h2>
        <p>I can help with flights, weather, hotels, and currency.</p>
        <div class="suggestions">
            <div class="suggestion-card">Check London Weather</div>
            <div class="suggestion-card">Flights from JFK to LHR</div>
            <div class="suggestion-card">Hotels in Dubai</div>
            <div class="suggestion-card">Convert 500 USD to EUR</div>
        </div>
    </div>

    <!-- Chat Messages -->
    <div id="chat-messages" class="chat-messages hidden"></div>

    <!-- Input Area -->
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="chat-input" placeholder="Ask about your trip..." autocomplete="off">
            <button id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const chatMessages = document.getElementById('chat-messages');
        const heroSection = document.getElementById('hero-section');
        const btnNewChat = document.getElementById('btn-new-chat');
        const suggestionCards = document.querySelectorAll('.suggestion-card');

        let currentSessionId = localStorage.getItem('voyage_session_id');

        // Render message bubble
        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'bot-message');
            msgDiv.innerHTML = text; // innerHTML allows markdown parsing from backend
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight; // Auto-scroll
        }

        // Show chat screen, hide hero
        function showChatScreen() {
            heroSection.classList.add('hidden');
            chatMessages.classList.remove('hidden');
        }

        // Main Send Function
        async function handleSend(messageText) {
            if (!messageText.trim()) return;

            showChatScreen();
            appendMessage(messageText, 'user');
            
            chatInput.value = '';
            sendBtn.disabled = true;

            // Show temporary loading message
            const loadingId = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.classList.add('message', 'bot-message');
            loadingDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Thinking...';
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                // FIXED FOR MOBILE/CLOUD: Using relative path '/chat'
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: messageText,
                        session_id: currentSessionId
                    })
                });

                const data = await response.json();
                
                // Remove loading message
                document.getElementById(loadingId).remove();

                if (data.session_id) {
                    currentSessionId = data.session_id;
                    localStorage.setItem('voyage_session_id', currentSessionId);
                }

                // Format simple newlines to HTML breaks if needed
                let formattedReply = data.reply.replace(/\n/g, "<br>");
                appendMessage(formattedReply, 'bot');

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('⚠️ Connection Error: Unable to reach backend. Please try again.', 'bot');
            }

            sendBtn.disabled = false;
            chatInput.focus();
        }

        // --- Event Listeners ---
        
        // Send Button Click
        sendBtn.addEventListener('click', () => handleSend(chatInput.value));

        // Enter Key Press
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend(chatInput.value);
        });

        // Suggestion Cards Click
        suggestionCards.forEach(card => {
            card.addEventListener('click', () => {
                handleSend(card.innerText);
            });
        });

        // NEW CHAT BUTTON FIX (Wipes Memory)
        btnNewChat.addEventListener('click', () => {
            // 1. Clear session ID
            currentSessionId = null;
            localStorage.removeItem('voyage_session_id');
            
            // 2. Clear UI
            chatMessages.innerHTML = '';
            
            // 3. Go back to Home Screen
            chatMessages.classList.add('hidden');
            heroSection.classList.remove('hidden');
        });
    </script>
</body>
</html>
